name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 组件库的构建脚本在 Windows 上最容易踩坑（路径分隔符、.cmd shim），
        # 因此三平台都跑，而不是只在 Linux 上跑。
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (含架构边界)
        run: pnpm lint

      - name: 依赖方向
        run: pnpm lint:deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: 公开类型面
        run: pnpm check:surface

      - name: 样式接入（gap/flex 静默失效）
        run: pnpm check:styles

      - name: 样式入口完整性
        run: pnpm check:style-entries

      - name: 发布产物依赖（第三道门禁）
        run: pnpm check:runtime-deps

      - name: publint
        run: pnpm check:packages

      - name: attw
        run: pnpm check:types

      - name: 消费者烟雾测试
        run: pnpm check:consumer

      # 本 job 覆盖 verify 的全部步骤（额外只有 verify:data-contract 这一道）：
      # 架构图语法错误不该等到发布前才被发现。
      - name: 架构图
        run: pnpm check:diagrams

      # 用真实 HTTP 验证 @fbkworks/data 契约对真实响应形状的适应性。
      # 单测里 fetch 是 stub，永远「形状正确」；真实后端会给字符串数字、
      # HTML 错误页、空 body —— 这些只有真打 HTTP 才能覆盖。
      # 只在 Linux 上跑：验证的是契约逻辑，与平台无关。
      - name: 数据契约（真实 HTTP）
        if: runner.os == 'Linux'
        run: pnpm verify:data-contract

      - name: Docs
        run: pnpm docs:build

  impact:
    name: 变更影响分析
    # 只在 PR 上跑：需要对比 base 分支，push 到 main 时没有对比对象
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 不阻断合并 —— 影响范围大不等于有问题，判断权在人。
    # 如果影响大就卡 CI，团队会开始"为了过 CI 而拆小 PR"，反而更难审查。
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能 diff base 分支
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 分析影响范围
        id: impact
        run: |
          pnpm check:impact --base "origin/${{ github.base_ref }}" --format markdown > impact.md || true
          cat impact.md

      - name: 贴到 PR 评论
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('impact.md', 'utf8')
            if (!body.trim()) return

            // 用固定标记识别自己的评论，避免每次 push 都刷一条新的
            const marker = '<!-- fbk-impact-report -->'
            const content = `${marker}\n${body}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: content,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: content,
              })
            }

  compat:
    name: 最小 peer 版本兼容
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 防止"只在最新版能跑"：用 peerDependencies 声明的最低版本重跑契约测试。
      - name: 安装最小 peer 版本
        run: |
          pnpm add -w -D element-plus@2.8.0 vant@4.9.0 naive-ui@2.40.0

      - name: 契约测试
        run: pnpm test
