name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

# ---- 关于 action 的 major 版本 ----
# 这些 action 的 major 与它自己的 Node 运行时绑定。node20 那一批已被 GitHub 强制跑在
# node24 上并警告弃用，弃用期结束后会直接失败 —— 所以钉的是**各自第一个跑 node24 的
# major**，不是最新 major：升 major 会同时带来行为变化，只为解决运行时问题跳多个 major
# 不值当。实测对照（升级前逐个查 action.yml 的 `using:`）：
#
#   checkout        v4=node20 → v5=node24
#   setup-node      v4=node20 → v5=node24
#   pnpm/action-setup v4=node20 → v5=node24
#   setup-python    v5=node20 → v6=node24     ← 不在 GitHub 的警告列表里
#   github-script   v7=node20 → v8=node24     ← 不在 GitHub 的警告列表里
#   changesets/action v1=node24（无需升级）
#
# 后两个没被点名，但一样跑在 node20 上：警告列表并不完整，别只看它。

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 组件库的构建脚本在 Windows 上最容易踩坑（路径分隔符、.cmd shim），
        # 所以 Windows 必须跑。
        #
        # macOS 在 2026-11-08 被拿掉了，理由是账：私有库的计费倍数是
        # Linux 1× / Windows 2× / macOS 10×，实测一轮 CI 约 46 计费分钟，
        # 其中 macOS 占 20（跑 1m40s，按 10 倍计）——43% 的成本换来的是
        # 「仓库在 macOS 上也能构建」，而发布产物本来就是 ubuntu 上构建的，
        # 对消费者没有增量价值。要恢复的话把这行加回去即可。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (含架构边界)
        run: pnpm lint

      - name: 依赖方向
        run: pnpm lint:deps

      # dependency-cruiser 对**裸说明符**不生效（实测：apps 里 import element-plus 报 0 违规），
      # 所以「UI 库只能在 adapters」这条红线用静态扫描补一道。
      - name: 架构红线（静态扫描）
        run: pnpm check:ui-imports

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: 公开类型面
        run: pnpm check:surface

      # 改一个 prop 的名字/类型对消费者是破坏性变更，此前没有任何门禁会红。
      # 基线在 api-snapshot/，有意改 API 时跑 pnpm gen:api-snapshot 并带上 diff。
      - name: 公开 API 快照
        run: pnpm check:api-snapshot

      # 按 exports 入口算「引入这一个入口实际要拉多少」（沿相对 import 走可达性）。
      # 阈值：比基线涨超 5% 且涨超 2 KB。有意增长时 pnpm gen:size-baseline 并带上 diff。
      - name: 包体积基线
        run: pnpm check:size

      - name: 样式接入（gap/flex 静默失效）
        run: pnpm check:styles

      # 样式清单由目录结构生成：新增组件却忘了生成时，引用聚合入口的应用
      # 会静默拿不到样式（不报错，只是不生效）。
      - name: 样式清单与组件目录一致
        run: pnpm check:style-index

      # 组件子路径入口在 package.json 的 exports 与 vite 的 entries 里各抄一份，
      # 抄漏不报错：消费者 import 子路径直接解析失败。两处都由目录结构生成。
      - name: 组件入口清单与目录一致
        run: pnpm check:package-entries

      - name: 样式入口完整性
        run: pnpm check:style-entries

      - name: 发布产物依赖（第三道门禁）
        run: pnpm check:runtime-deps

      - name: publint
        run: pnpm check:packages

      - name: attw
        run: pnpm check:types

      - name: 消费者烟雾测试
        run: pnpm check:consumer

      # resolver 映射由 components 的导出生出：新增组件却忘了生成，
      # 自动导入会静默失效（.vue 里写 <FbkXxx> 不报错、只是不生效）。
      - name: resolver 映射与组件导出一致
        run: pnpm check:resolver-map

      # 能力位必须交代验证责任，且「未验证」必须为 0。
      # 它此前长期红着（11 条欠债）所以没进门禁；欠债清零后钉死在这里。
      - name: 能力位覆盖（strict）
        run: pnpm check:capabilities

      # 发布清单与拓扑序：新增发布包却忘了登记进 ORDER，在这里就红，
      # 而不是等到发版时才发现依赖的包从未上架。
      - name: 发布清单与顺序
        run: pnpm check:publish-order

      # 本 job 覆盖 verify 的全部步骤（额外只有 verify:data-contract 这一道）：
      # 架构图语法错误不该等到发布前才被发现。
      - name: 架构图
        run: pnpm check:diagrams

      # 用真实 HTTP 验证 @fbkworks/data 契约对真实响应形状的适应性。
      # 单测里 fetch 是 stub，永远「形状正确」；真实后端会给字符串数字、
      # HTML 错误页、空 body —— 这些只有真打 HTTP 才能覆盖。
      # 只在 Linux 上跑：验证的是契约逻辑，与平台无关。
      - name: 数据契约（真实 HTTP）
        if: runner.os == 'Linux'
        run: pnpm verify:data-contract

      - name: Docs
        run: pnpm docs:build

  visual:
    name: 视觉回归（真实浏览器）
    # 只在 Linux 跑：这些断言验的是「布局与绘制」，与操作系统无关，
    # 三平台各装一份 chromium 只会把 CI 时间翻三倍。
    #
    # 故意不依赖 `pnpm build`：playground/admin 的 workspace alias 从 package.json
    # 的 exports 推导、把 dist/ 换成 src/，所以没构建产物也能起服务。
    # 这条已实测（删掉全部 dist 后起 playground，verify-charts 仍全过），
    # 不存在「本地有 dist 所以过、CI 没 dist 所以挂」的假绿。
    #
    # 镜像钉死到 24.04，不用 ubuntu-latest：`latest` 已经滚到 26.04，
    # 而 Playwright 1.60.0 不认识它（实测报 "Playwright does not support chromium
    # on ubuntu26.04-x64"）。这里钉镜像而不是升 Playwright —— 镜像升级会有明确的
    # 弃用公告，Playwright 的版本漂移是静默的。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile

      # 版本写死到本地实测过的那个：playwright 的驱动与浏览器二进制必须配套，
      # 悬空版本会出现「本地过了、CI 起不来浏览器」。
      - name: 安装 Playwright 与 chromium
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.60.0"
          python -m playwright install --with-deps chromium

      # 每个脚本都要一个 dev server，且「起服务 → 等就绪 → 跑脚本 → 收尾」放在
      # 同一步里：后台进程跨步骤存活在 runner 上不可靠。
      - name: 图表 / Playground / 表单能力位
        run: |
          pnpm playground > /tmp/playground.log 2>&1 &
          PG_PID=$!
          # 本地实测：只 kill pnpm 时 vite 会活下来占着端口（Windows 的 shim 不转发信号）。
          # Linux 上 pnpm 一般会转发，pkill 只是兜底；两者都没命中也不影响 —— 下一步用的是另一个端口。
          trap 'pkill -P $PG_PID 2>/dev/null || true; kill $PG_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:5174/ && break
            if [ "$i" = 120 ]; then
              echo "::error::playground 在 120s 内未就绪"
              tail -n 40 /tmp/playground.log
              exit 1
            fi
            sleep 1
          done
          python scripts/visual/verify-charts.py 5174
          python scripts/visual/verify-playground.py 5174
          python scripts/visual/verify-form-capabilities.py 5174
          python scripts/visual/compare-controls.py 5174

      # verify-admin 覆盖的是「组件在页面级组合场景」：工具条/批量条层级、
      # 权限移除是删 DOM 而不是 display:none、上报事件真的可达 —— 单测看不到这些。
      - name: 后台系统端到端
        run: |
          pnpm admin > /tmp/admin.log 2>&1 &
          ADMIN_PID=$!
          trap 'pkill -P $ADMIN_PID 2>/dev/null || true; kill $ADMIN_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:5185/ && break
            if [ "$i" = 120 ]; then
              echo "::error::admin 在 120s 内未就绪"
              tail -n 40 /tmp/admin.log
              exit 1
            fi
            sleep 1
          done
          python scripts/visual/verify-admin.py 5185

      # 无障碍：axe 扫 52 个页面（15 demo × 3 适配器 + 7 个 admin 页）的内容区。
      # 棘轮形态 —— 现状 181 处 serious/critical 记在 a11y-baseline.json，
      # 只拦新增；修好一批就跑 pnpm gen:a11y-baseline，那份 diff 就是还债记录。
      - name: 无障碍（axe，按基线只拦新增）
        run: |
          pnpm playground > /tmp/playground-a11y.log 2>&1 &
          PG_PID=$!
          pnpm admin > /tmp/admin-a11y.log 2>&1 &
          ADMIN_PID=$!
          trap 'pkill -P $PG_PID 2>/dev/null || true; pkill -P $ADMIN_PID 2>/dev/null || true; kill $PG_PID $ADMIN_PID 2>/dev/null || true' EXIT
          for port in 5174 5185; do
            for i in $(seq 1 120); do
              curl -sf -o /dev/null "http://localhost:$port/" && break
              if [ "$i" = 120 ]; then
                echo "::error::端口 $port 在 120s 内未就绪"
                tail -n 40 /tmp/playground-a11y.log /tmp/admin-a11y.log
                exit 1
              fi
              sleep 1
            done
          done
          python scripts/visual/verify-a11y.py

  impact:
    name: 变更影响分析
    # 只在 PR 上跑：需要对比 base 分支，push 到 main 时没有对比对象
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 不阻断合并 —— 影响范围大不等于有问题，判断权在人。
    # 如果影响大就卡 CI，团队会开始"为了过 CI 而拆小 PR"，反而更难审查。
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 需要完整历史才能 diff base 分支
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 分析影响范围
        id: impact
        run: |
          pnpm check:impact --base "origin/${{ github.base_ref }}" --format markdown > impact.md || true
          cat impact.md

      - name: 贴到 PR 评论
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('impact.md', 'utf8')
            if (!body.trim()) return

            // 用固定标记识别自己的评论，避免每次 push 都刷一条新的
            const marker = '<!-- fbk-impact-report -->'
            const content = `${marker}\n${body}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: content,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: content,
              })
            }

  compat:
    name: 最小 peer 版本兼容
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 防止"只在最新版能跑"：用 peerDependencies 声明的最低版本重跑契约测试。
      #
      # 注意：`pnpm add -w -D element-plus@2.8.0` **不够** —— 它只改根 importer，
      # 而三个适配器各自有 auto-install-peers 装出来的独立副本，测试仍然跑最新版。
      # 实测：执行上面那条命令后，packages/adapters/element-plus 里 require 到的还是 2.14.7。
      # 所以这里用 pnpm overrides 把整个依赖图压到最低版本，并在下一步**断言它真的压下去了**。
      - name: 固定到最低 peer 版本
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.pnpm = { ...(pkg.pnpm || {}), overrides: { 'element-plus': '2.8.0', vant: '4.9.0', 'naive-ui': '2.40.0' } };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '
');
          "
          pnpm install --no-frozen-lockfile

      # 没有这一步，上面那条命令失效时这个 job 会静默地跑最新版 —— 也就是假绿。
      - name: 确认真的装到了最低版本
        run: |
          node -e "
          const { execSync } = require('child_process');
          const want = { 'element-plus': '2.8.0', vant: '4.9.0', 'naive-ui': '2.40.0' };
          let bad = 0;
          for (const [lib, ver] of Object.entries(want)) {
            const got = execSync('node -p \"require(\\'' + lib + '\\/package.json\\').version\"', {
              cwd: 'packages/adapters/' + lib,
            }).trim();
            console.log(lib + ': ' + got);
            if (got !== ver) { console.error('✗ ' + lib + ' 期望 ' + ver + '，实际 ' + got); bad += 1; }
          }
          process.exit(bad ? 1 : 0);
          "

      - name: 契约测试
        run: pnpm test
