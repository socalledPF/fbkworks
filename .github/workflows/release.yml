name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ---- 关于 action 的 major 版本 ----
# 这些 action 的 major 与它自己的 Node 运行时绑定。node20 那一批已被 GitHub 强制跑在
# node24 上并警告弃用，弃用期结束后会直接失败 —— 所以钉的是**各自第一个跑 node24 的
# major**，不是最新 major：升 major 会同时带来行为变化，只为解决运行时问题跳多个 major
# 不值当。实测对照（升级前逐个查 action.yml 的 `using:`）：
#
#   checkout        v4=node20 → v5=node24
#   setup-node      v4=node20 → v5=node24
#   pnpm/action-setup v4=node20 → v5=node24
#   setup-python    v5=node20 → v6=node24     ← 不在 GitHub 的警告列表里
#   github-script   v7=node20 → v8=node24     ← 不在 GitHub 的警告列表里
#   changesets/action v1=node24（无需升级）
#
# 后两个没被点名，但一样跑在 node20 上：警告列表并不完整，别只看它。

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: 发布前跑一遍契约测试
        run: pnpm test

      # changeset publish 自己会按依赖排序，但**不检查有没有漏包** ——
      # 新增发布包却忘了登记进 ORDER 时，它照样会发出一堆依赖不存在包的东西。
      # 这道闸门校验「public 包全覆盖 + 拓扑序成立」，不通过就一个包都不发。
      - name: 校验发布清单与顺序
        run: pnpm check:publish-order

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 公开 npm 的 Automation token，放在仓库 secrets 里，不要写进 .npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
