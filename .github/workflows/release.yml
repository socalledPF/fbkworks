name: Release

# 不在 push 上直接发布：必须等 CI 绿。
#
# 起因（2026-11-08，提交 e596bd6）：Release 在 08:22:33 就把 0.4.0 发上了 npm，
# 而 CI 08:27:22 才给出结论 —— **发布比门的结论早 4 分 49 秒**。发布路径自己只跑
# install / test / check:publish-order，verify 另外 17 道（attw、consumer 烟雾测试、
# 公开类型面、体积基线……）在发布前根本不跑。
#
# 常规兜底是「让 main 只能合绿 PR」，但这个仓库是私有 + 免费计划，分支保护/ruleset
# 都开不了（API 403）。所以只能在 workflow 层面解决：改成由 CI 的完成事件触发。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 逃生口：CI 因与本次发布无关的原因红（比如视觉脚本抖动）时可以手动发。
  # 手动触发没有 CI 结论可依赖，所以下面仍保留 test 与 publish-order 两道兜底。
  # 别把它当常规路径 —— 绕过的就是这道门本身。
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ---- 关于 action 的 major 版本 ----
# 这些 action 的 major 与它自己的 Node 运行时绑定。node20 那一批已被 GitHub 强制跑在
# node24 上并警告弃用，弃用期结束后会直接失败 —— 所以钉的是**各自第一个跑 node24 的
# major**，不是最新 major：升 major 会同时带来行为变化，只为解决运行时问题跳多个 major
# 不值当。实测对照（升级前逐个查 action.yml 的 `using:`）：
#
#   checkout        v4=node20 → v5=node24
#   setup-node      v4=node20 → v5=node24
#   pnpm/action-setup v4=node20 → v5=node24
#   setup-python    v5=node20 → v6=node24     ← 不在 GitHub 的警告列表里
#   github-script   v7=node20 → v8=node24     ← 不在 GitHub 的警告列表里
#   changesets/action v1=node24（无需升级）
#
# 后两个没被点名，但一样跑在 node20 上：警告列表并不完整，别只看它。

jobs:
  release:
    # workflow_run 也会被 PR 上的 CI 触发，三个条件缺一不可：
    # 只有「push 到 main 触发的 CI」且成功才发布。手动触发不受此限。
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 必须显式取触发那次 CI 的 sha：workflow_run 事件里 github.sha 是默认分支
          # 的最新提交，不是这次通过门禁的那个提交。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # 这两道在 CI 里也跑过（test 是第 4 步、publish-order 是第 18 步）。
      # 留在这里是为了 workflow_dispatch —— 手动发布时没有任何 CI 结论背书。
      - name: 发布前跑一遍契约测试
        run: pnpm test

      # changeset publish 自己会按依赖排序，但**不检查有没有漏包** ——
      # 新增发布包却忘了登记进 ORDER 时，它照样会发出一堆依赖不存在包的东西。
      # 这道闸门校验「public 包全覆盖 + 拓扑序成立」，不通过就一个包都不发。
      - name: 校验发布清单与顺序
        run: pnpm check:publish-order

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 公开 npm 的 Automation token，放在仓库 secrets 里，不要写进 .npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
