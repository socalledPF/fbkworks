<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FBK">
  <title>FBK</title>
  <!--
    FBK 标识：一个统一 API 面（上梁）扇出到三个适配器（下三柱）。
    对应架构图里的 components → adapter-core → adapters 单向依赖。

    几何规则（32 网格）：
      上梁   x 4→28，y 5→11，高 6
      下三柱 y 17→27，高 10，宽 6，间距 3
      上下间距 6，与柱间距 3 成 2:1，视觉上区分「层」与「同类」
    整体 bbox 24×22，四边各留 4/5，保证任何尺寸下有等量留白。

    为什么柱高是 10 而不是 8：导航条里标识的实际显示尺寸是 24px，
    按 32 网格折算，柱高 8 只有 6px、圆角又吃掉两角，看上去是三个「点」而不是三根「柱」，
    整个「一拖三」的意象就散了。加高到 10、圆角收到 1.5 之后，24px 下仍能读出是三根柱子。
    改这个数字前请先按 24px 实际渲染确认，不要只看大图。
  -->
  <g fill="#2f6bff">
    <rect x="4" y="5" width="24" height="6" rx="2" />
    <rect x="4" y="17" width="6" height="10" rx="1.5" />
    <rect x="13" y="17" width="6" height="10" rx="1.5" />
    <rect x="22" y="17" width="6" height="10" rx="1.5" />
  </g>
</svg>
